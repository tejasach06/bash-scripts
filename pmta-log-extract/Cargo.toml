[package]
name = "pmta-log-extract"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
flate2 = "1.0"
bzip2 = "0.4"
zip = { version = "2.2", default-features = false, features = ["deflate", "bzip2"] }
tar = "0.4"
csv = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
glob = "0.3"
rayon = "1.10"
memchr = "2.7"
tempfile = "3.10"
